<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog preview card about HTML and CSS foundations.">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="main">
    <header class="main__header">
      <img class="main__illustration" alt="" aria-hidden="true" src="assets/images/illustration-article.svg">
      <span class="main__eyebrow">Learning</span>
      <p class="main__date">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
      <h1 class="main__heading">HTML & CSS foundations</h1>
    </header>
    <section class="main__section">
      <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
    </section>
    <address class="main__author-profile">
      <figure class="main__figure">
        <img src="assets/images/image-avatar.webp" alt="Portrait of Greg Hooper" class="main__author-photo">
        <figcaption class="main__figcaption">
          <a href="#" rel="author" class="main__author-link">Greg Hooper</a>
        </figcaption>
      </figure>
    </address>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/Rodrigo479/">Rodrigo</a>.
  </footer>
</body>

</html>
